<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A1912">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tasbih">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Tasbih Digital</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A1912;color:#fff;font-family:system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:92%;max-width:380px;background:#152A22;border:1px solid rgba(212,175,55,0.2);border-radius:32px;padding:24px;text-align:center}
.ring{width:260px;height:260px;margin:0 auto;border-radius:50%;border:4px solid rgba(212,175,55,0.3);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.num{font-size:96px;font-weight:900;line-height:1}
.sub{color:#D4AF37;letter-spacing:3px;font-size:12px;margin-top:8px}
.btn{margin-top:24px;width:100%;padding:18px;border-radius:16px;border:1px solid rgba(212,175,55,0.4);background:rgba(212,175,55,0.1);color:#D4AF37;font-weight:700;letter-spacing:2px}
.row{display:flex;gap:12px;margin-top:16px}
.toggle{flex:1;background:#1E352A;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:#D4AF37}
</style>
</head>
<body>
<div class="card">
<div class="sub">DZIKIR</div>
<div class="ring" id="ring">
<div class="num" id="num">0</div>
<div class="sub" id="prog">0 / 100</div>
</div>
<div style="margin-top:12px;color:#6B8A7A;font-size:11px">SENTUH UNTUK MULAI • TOTAL: <span id="total">0</span></div>
<button class="btn" id="reset">RESET KE NOL</button>
<div class="row">
<div class="toggle">GETAR <span id="vibState">ON</span></div>
<div class="toggle">SUARA <span id="sndState">ON</span></div>
</div>
</div>
<script>
let cur=parseInt(localStorage.getItem('tasbih_cur')||'0');
let cyc=parseInt(localStorage.getItem('tasbih_cyc')||'0');
let vib=localStorage.getItem('tasbih_vib')!=='false';
let snd=localStorage.getItem('tasbih_snd')!=='false';
let audioCtx=null;
function playClick(){if(!snd)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.frequency.value=800;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.3, audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);o.start();o.stop(audioCtx.currentTime+0.08);}
function doVib(p){if(!vib)return;if(navigator.vibrate)navigator.vibrate(p);}
function render(){document.getElementById('num').textContent=cur;document.getElementById('prog').textContent=cur+' / 100';document.getElementById('total').textContent=cyc*100+cur;document.getElementById('vibState').textContent=vib?'ON':'OFF';document.getElementById('sndState').textContent=snd?'ON':'OFF';}
function tap(){if(cur>=100){cur=0;cyc++;doVib([50,30,80]);}cur++;if(cur>100){cur=1;cyc++;}if(cyc*100+cur>=999){cur=999-cyc*100;doVib([100,50,100,50,200]);}else{doVib(30);}playClick();localStorage.setItem('tasbih_cur',cur);localStorage.setItem('tasbih_cyc',cyc);render();}
document.getElementById('ring').addEventListener('click',tap);
document.getElementById('reset').addEventListener('click',()=>{cur=0;cyc=0;localStorage.setItem('tasbih_cur','0');localStorage.setItem('tasbih_cyc','0');render();doVib([30,30,30]);});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
